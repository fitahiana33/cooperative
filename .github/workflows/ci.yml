name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cooperative
          POSTGRES_PASSWORD: cooperative
          POSTGRES_DB: cooperative
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cooperative"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_NAME: Cooperative API
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://cooperative:cooperative@localhost:5432/cooperative
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      API_V1_PREFIX: /api/v1
      ALLOWED_ORIGINS: '["http://localhost:5173"]'
      JWT_ALGORITHM: HS256
      DEFAULT_ADMIN_EMAIL: admin@cooperative.com
      DEFAULT_ADMIN_PASSWORD: Admin123!
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest

  web:
    name: Web (type check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  mobile:
    name: Mobile (analyze)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
