name: Memoire ITU preuves
on:
  push:
    branches:
      - evidence/memoire-2026-11-11
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build et tests web
        run: |
          mkdir -p preuves/web
          (cd web && npm ci && npm run build && npm run test:e2e) > preuves/web/tests.log 2>&1 || true
      - name: Installer navigateur
        run: |
          cd tools/evidence
          npm install playwright@1.56.1 --no-save
          npx playwright install --with-deps chromium
      - name: Captures reelles web
        run: node tools/evidence/capture_web.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preuves-web-memoire
          path: preuves/web
          if-no-files-found: warn
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyse et compilation mobile
        run: |
          mkdir -p preuves/mobile
          cd mobile
          flutter pub get > ../preuves/mobile/pubget.log 2>&1
          flutter analyze --no-fatal-infos > ../preuves/mobile/analyse.log 2>&1 || true
          flutter test > ../preuves/mobile/tests.log 2>&1 || true
          flutter build apk --debug --dart-define=MOBILE_API_BASE_URL=https://cooperative-api-3yuz.onrender.com/api/v1 > ../preuves/mobile/build.log 2>&1
      - name: Captures reelles Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          script: bash tools/evidence/capture_mobile.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preuves-android-memoire
          path: preuves/mobile
          if-no-files-found: warn
