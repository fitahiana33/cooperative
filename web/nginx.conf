server {
  listen 5173;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http: https:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  location / { try_files $uri $uri/ /index.html; }
}
