services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-p", "${POSTGRES_CONTAINER_PORT:-5432}"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p ${POSTGRES_CONTAINER_PORT:-5432}"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    env_file: .env
    command: sh -c "alembic upgrade head && python -m app.db.seed"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
